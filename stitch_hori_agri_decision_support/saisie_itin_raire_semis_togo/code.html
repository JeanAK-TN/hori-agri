<!-- Micro-interactions Script -->
<script>
        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('change', (e) => {
                if (e.target.value) {
                    e.target.closest('.bg-surface-container-lowest').classList.add('border-primary');
                } else {
                    e.target.closest('.bg-surface-container-lowest').classList.remove('border-primary');
                }
            });
        });

        const nextBtn = document.querySelector('button.bg-primary');
        nextBtn.addEventListener('click', () => {
