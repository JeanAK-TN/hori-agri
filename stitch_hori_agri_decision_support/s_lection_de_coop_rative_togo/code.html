</div>
</div>
</div>
<!-- Selection Title -->
<div class="w-full mb-6 text-left fade-in" style="animation-delay: 0.2s;">

<p class="text-body-md text-on-surface-variant">Choisissez l'entité avec laquelle vous souhaitez travailler aujourd'hui.</p>

<script>
        function selectCoop(name) {
            console.log('Selected cooperative:', name);
            const cards = document.querySelectorAll('.coop-card');
            cards.forEach(card => {
                if (card.innerText.includes(name)) {
                    card.classList.add('ring-2', 'ring-primary', 'bg-primary-fixed');
                } else {
                    card.style.opacity = '0.5';
                }
            });
            
            setTimeout(() => {
                alert(`Chargement de l'espace ${name}...`);
            }, 300);
        }
    </script>
