<style>
        body {
            font-family: "Source Sans 3", sans-serif;
            background-color: #f3faff;
            color: #071e27;
        }
        h1, h2, h3 {
            font-family: "Work Sans", sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            background: #ffffff;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #cfe6f2;
        }
        input:focus {
            outline: none;
            border-color: #2a6b2c;
            box-shadow: 0 0 0 2px rgba(42, 107, 44, 0.2);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        .delay-200 {
            animation-delay: 0.2s;
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
<!-- Top Branding / Logo Container -->
<header class="w-full max-w-sm mb-8 flex flex-col items-center animate-fade-in">
<div class="w-24 h-24 mb-4 flex items-center justify-center">
<img alt="Hori Agri Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLuxTiZP_w9x4OgM1mfHAVTb2SvhnnSDQCnQQU1nGlpr4UqpTuyN4Y7D11nn62NXT4bEV6fkrZhiN_jkKdukDahqpjfhZuT0PNsN5MLPp3xwpiAVx3yFefz5Kq4Gbe2MpXUS0mBU0PVTZ_-QGHn-uMY60tdYCa8KJn-Icq_Wx3VBmm4OZfd-Q5-OY9KaaN7Oc9IiU9VFrKRCQgWIE59yffbGXXU8xQ8tbPgLlLvc7qgrqSD9DShdn9Xt7yk"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center">
            Hori Agri
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">
            Aide à la décision agronomique
        </p>
</header>
<!-- Main Login Form -->
<main class="w-full max-w-sm login-card rounded-xl p-8 transition-all duration-300">
<form class="space-y-6" id="loginForm">
<!-- Email Field -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">
                    Adresse e-mail
                </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">
                        mail
                    </span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface transition-colors" id="email" name="email" placeholder="nom@exemple.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">
                        Mot de passe
                    </label>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">
                        lock
                    </span>
<input class="w-full h-12 pl-11 pr-12 bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-12 bg-primary text-on-primary font-headline-md text-xl rounded-lg shadow-sm transition-all transform active:scale-95 flex items-center justify-center space-x-2" type="submit">
<span>Se connecter</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="mt-6 flex flex-col items-center">
<a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors underline-offset-4 hover:underline" href="#">
                Mot de passe oublié ?
            </a>
</div>
</main>
<!-- Footer - Admin notification -->
<footer class="mt-8 animate-fade-in delay-200">
<p class="font-body-md text-body-md text-on-surface-variant text-center px-4">
            Les comptes sont créés uniquement par l'administrateur.
        </p>
</footer>
<!-- Interactive Layer -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.innerText = 'visibility';
            }
        }

        // Simple form handling simulation
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                alert('Connexion en cours...');
            }, 1500);
        });
    </script>
</body></html>
